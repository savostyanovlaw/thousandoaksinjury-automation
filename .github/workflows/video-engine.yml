name: Video Engine
on:
  # Two ways a run can happen: the daily scheduled selector (California-wide
  # primary strategy, data-driven topic choice -- see
  # scripts/video_topic_selector.py), or an explicit dispatch with a real
  # topic/location (e.g. Content Creator's automatic handoff, or a manual
  # operator request). Either way, at most one proposal is produced per
  # America/Los_Angeles calendar day -- enforced in code, not by the cron
  # schedule alone, since a dispatch can also land on the same Pacific day.
  workflow_dispatch:
    inputs:
      topic:
        description: Real personal-injury topic. Leave blank (with location) to let the daily data-driven selector choose one instead.
        required: false
        default: ''
        type: string
      location:
        description: Real target location (a California city/region, or "California" for statewide content). Leave blank with topic to use the daily selector.
        required: false
        default: ''
        type: string
      source_id:
        description: Identifier of the real source that produced this topic (required only when topic/location are given explicitly)
        required: false
        default: ''
        type: string
  schedule:
    - cron: '30 15 * * *'
  pull_request:
    paths: ['scripts/video_engine.py','scripts/video_topic_bank.py','scripts/video_topic_selector.py','scripts/video_engine_daily.py','tests/test_video_engine.py','tests/test_video_topic_bank.py','tests/test_video_topic_selector.py','tests/test_video_engine_daily.py','.github/workflows/video-engine.yml']
permissions: {contents: read, actions: read, id-token: write}
# The one-proposal-per-Pacific-day cap is enforced by reconstructing history
# from past runs' own logs (see video_engine_daily.py) -- a run that is
# still in progress has not yet printed its marker, so it is invisible to a
# second run's history check. Without this, the schedule firing at the same
# moment as a workflow_dispatch (e.g. Content Creator's automatic handoff)
# could let two runs both see "not yet proposed today" and both produce a
# proposal. Serializing runs (never cancelling one to run behind another)
# closes that race exactly the way technical-seo-watchdog.yml already does
# for its own cross-trigger overlap.
concurrency:
  group: video-engine
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest tests.test_video_engine tests.test_video_topic_bank tests.test_video_topic_selector tests.test_video_engine_daily -v

      - name: Check live content-gap signals (Opportunity Finder)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p artifacts/video-engine
          python3 scripts/opportunity_finder.py --output artifacts/video-engine/opportunity-report.json

      - name: Select today's data-driven topic and build its package
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.topic == '')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/video-engine
          python3 scripts/video_engine_daily.py \
            --output artifacts/video-engine/package.json \
            --source-id "video-engine-daily:${GITHUB_RUN_ID}" \
            --opportunity-report artifacts/video-engine/opportunity-report.json

      - name: Generate attorney-review video package from an explicit dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.topic != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOPIC: ${{ inputs.topic }}
          LOCATION: ${{ inputs.location }}
          SOURCE_ID: ${{ inputs.source_id }}
        run: |
          mkdir -p artifacts/video-engine
          python3 - <<'PY'
          import json, os
          from scripts.video_engine import build_video_package
          from scripts.video_engine_daily import GitHubClient, load_history
          from scripts.video_topic_selector import already_proposed_today

          # The daily cap is global: an explicit dispatch (e.g. Content
          # Creator's automatic handoff) must not produce a second proposal
          # on a Pacific calendar day the scheduled selector (or an earlier
          # dispatch) already used.
          token = os.environ.get("GITHUB_TOKEN")
          repository = os.environ.get("GITHUB_REPOSITORY")
          history = load_history(GitHubClient(repository, token)) if token and repository else []
          if already_proposed_today(history):
              print(json.dumps({"produced": False, "reason": "A video proposal was already produced today (America/Los_Angeles)."}))
          else:
              result = build_video_package(os.environ["TOPIC"], os.environ["LOCATION"], os.environ.get("SOURCE_ID") or "workflow-dispatch:manual")
              with open("artifacts/video-engine/package.json", "w", encoding="utf-8") as handle:
                  handle.write(json.dumps(result, ensure_ascii=False, indent=2) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with: {name: video-engine-package, path: artifacts/video-engine/package.json, if-no-files-found: warn, retention-days: 30}

      - name: Expose result to owner Review Queue
        if: github.event_name != 'pull_request'
        run: |
          if [ -f artifacts/video-engine/package.json ]; then
            python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/video-engine/package.json').read_bytes()).decode())"
          else
            echo "No proposal produced this run (daily cap already used, or no eligible topic) -- nothing to expose."
          fi

      - name: Notify Control Center of new result
        if: always() && github.event_name != 'pull_request'
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
        run: |
          if [ ! -f artifacts/video-engine/package.json ]; then
            echo "No report produced; skipping Control Center ingestion."
          elif [ -z "$CONTROL_CENTER_URL" ]; then
            echo "::warning::CONTROL_CENTER_URL not configured; the result will still reach Needs Approval next time the dashboard loads."
          else
            OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=slc-ai-control-ingest" | python3 -c "import json,sys; print(json.load(sys.stdin).get('value',''))")
            if [ -z "$OIDC_TOKEN" ]; then
              echo "::warning::Could not obtain a GitHub OIDC token; dashboard-load reconciliation remains as fallback."
            else
              curl -sS -f -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"agentId\":\"video-engine\",\"runId\":\"${GITHUB_RUN_ID}\"}" \
                || echo "::warning::Control Center ingest call failed; dashboard-load reconciliation remains as fallback."
            fi
          fi
