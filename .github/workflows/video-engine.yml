name: Video Engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/video_engine.py'
      - 'tests/test_video_engine.py'
      - '.github/workflows/video-engine.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Video Engine tests
        run: python -m unittest tests.test_video_engine -v
