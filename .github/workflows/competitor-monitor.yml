name: Competitor Monitor
on:
  schedule:
    - cron: '15 16 * * 2,5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest tests.test_competitor_monitor
      - run: python scripts/competitor_monitor.py --output artifacts/competitor-monitor/report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-monitor-report
          path: artifacts/competitor-monitor/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Expose result to owner Review Queue
        if: always()
        run: |
          if [ -f artifacts/competitor-monitor/report.json ]; then
            python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/competitor-monitor/report.json').read_bytes()).decode())"
          fi

      - name: Notify Control Center of new result
        if: always()
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
          CONTROL_INGEST_TOKEN: ${{ secrets.CONTROL_INGEST_TOKEN }}
        run: |
          if [ ! -f artifacts/competitor-monitor/report.json ]; then
            echo "No report produced; skipping Control Center ingestion."
          elif [ -z "$CONTROL_CENTER_URL" ] || [ -z "$CONTROL_INGEST_TOKEN" ]; then
            echo "::warning::CONTROL_CENTER_URL/CONTROL_INGEST_TOKEN not configured; the result will still reach Needs Approval next time the dashboard loads."
          else
            curl -sS -f -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
              -H "X-Control-Ingest-Token: $CONTROL_INGEST_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"agentId\":\"competitor-monitor\",\"runId\":\"${GITHUB_RUN_ID}\"}" \
              || echo "::warning::Control Center ingest call failed; dashboard-load reconciliation remains as fallback."
          fi
