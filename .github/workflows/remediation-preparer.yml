name: Remediation Preparer

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Remediation job ID
        required: true
        type: string
      source_agent_id:
        description: Source agent ID
        required: true
        type: string
      source_run_id:
        description: Source workflow run ID
        required: true
        type: string
      finding_type:
        description: Finding type
        required: true
        type: string
      summary:
        description: Finding summary
        required: true
        type: string
      recommended_action:
        description: Recommended remediation action
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bounded remediation
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          SOURCE_AGENT_ID: ${{ inputs.source_agent_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          FINDING_TYPE: ${{ inputs.finding_type }}
          SUMMARY: ${{ inputs.summary }}
          RECOMMENDED_ACTION: ${{ inputs.recommended_action }}
        run: |
          set -euo pipefail
          BRANCH="remediation/$JOB_ID"
          git checkout -b "$BRANCH"
          mkdir -p remediation
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path("remediation")/(os.environ["JOB_ID"]+".json")
          p.write_text(json.dumps({
            "jobId":os.environ["JOB_ID"],"sourceAgentId":os.environ["SOURCE_AGENT_ID"],
            "sourceRunId":os.environ["SOURCE_RUN_ID"],"findingType":os.environ["FINDING_TYPE"],
            "summary":os.environ["SUMMARY"],"recommendedAction":os.environ["RECOMMENDED_ACTION"],
            "executionPolicy":{"branchOnly":True,"testsRequired":True,"pullRequestRequired":True,
              "mergeAllowed":False,"deployAllowed":False,"publishAllowed":False}
          },indent=2)+"\n")
          PY
          # Only deterministic, allowlisted technical fixes may modify repository files here.
          case "$FINDING_TYPE" in
            robots)
              python3 - <<'PY'
          from pathlib import Path
          p=Path("website/robots.txt")
          s=p.read_text()
          sitemap="Sitemap: https://thousandoaksinjury.com/sitemap.xml"
          if sitemap not in s:
              s=s.rstrip()+"\n"+sitemap+"\n"
              p.write_text(s)
          PY
              ;;
            *)
              echo "No deterministic repository mutation is allowlisted for $FINDING_TYPE; metadata-only remediation PR."
              ;;
          esac
          python3 -m unittest discover -s tests -p 'test_*.py'
          git config user.name "SLC Remediation Agent"
          git config user.email "actions@users.noreply.github.com"
          git add remediation/ website/robots.txt
          git commit -m "Prepare remediation $JOB_ID"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Remediation: $SUMMARY" --body "Prepared from approved report run $SOURCE_RUN_ID. Tests passed. No content publication is authorized by this workflow."
        env:
          GH_TOKEN: ${{ github.token }}
