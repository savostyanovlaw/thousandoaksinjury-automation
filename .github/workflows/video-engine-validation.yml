name: Video Engine Validation
on:
  pull_request:
    paths:
      - 'scripts/video_engine.py'
      - 'tests/test_video_engine.py'
      - '.github/workflows/video-engine.yml'
      - '.github/workflows/video-engine-validation.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_video_engine
