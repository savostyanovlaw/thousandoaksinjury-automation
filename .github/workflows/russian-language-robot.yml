name: Russian Language Robot
on:
  # Event-driven: dispatched with a real English source (title/body) that
  # already exists, e.g. from Content Creator's own generated draft. It is
  # never invoked with fabricated/placeholder source material, so autonomous
  # scheduling stays paused until a real caller supplies real content.
  workflow_dispatch:
    inputs:
      source_id:
        description: Identifier of the real source content being localized
        required: true
        type: string
      source_revision:
        description: Revision of the real source content (commit SHA or run id)
        required: true
        type: string
      title:
        description: Real English source title to localize
        required: true
        type: string
      body:
        description: Real English source body to localize
        required: true
        type: string
  pull_request:
    paths: ['scripts/russian_language_robot.py','tests/test_russian_language_robot.py','.github/workflows/russian-language-robot.yml']
permissions: {contents: read, id-token: write}
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest tests.test_russian_language_robot -v
      - name: Generate attorney-review Russian package
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_ID: ${{ inputs.source_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
        run: |
          mkdir -p artifacts/russian-language-robot
          python3 - <<'PY'
          import json, os
          from scripts.russian_language_robot import localize
          result=localize(os.environ["SOURCE_ID"],os.environ["SOURCE_REVISION"],os.environ["TITLE"],os.environ["BODY"])
          open("artifacts/russian-language-robot/draft.json","w").write(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with: {name: russian-language-review-draft, path: artifacts/russian-language-robot/draft.json, retention-days: 30}
      - name: Expose result to owner Review Queue
        if: github.event_name == 'workflow_dispatch'
        run: python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/russian-language-robot/draft.json').read_bytes()).decode())"

      - name: Notify Control Center of new result
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
        run: |
          if [ ! -f artifacts/russian-language-robot/draft.json ]; then
            echo "No report produced; skipping Control Center ingestion."
          elif [ -z "$CONTROL_CENTER_URL" ]; then
            echo "::warning::CONTROL_CENTER_URL not configured; the result will still reach Needs Approval next time the dashboard loads."
          else
            OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=slc-ai-control-ingest" | python3 -c "import json,sys; print(json.load(sys.stdin).get('value',''))")
            if [ -z "$OIDC_TOKEN" ]; then
              echo "::warning::Could not obtain a GitHub OIDC token; dashboard-load reconciliation remains as fallback."
            else
              curl -sS -f -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"agentId\":\"russian-language-robot\",\"runId\":\"${GITHUB_RUN_ID}\"}" \
                || echo "::warning::Control Center ingest call failed; dashboard-load reconciliation remains as fallback."
            fi
          fi
