name: Technical SEO Watchdog

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      remediation_e2e_fixture:
        description: 'Emit a safe synthetic robots finding for remediation E2E validation'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: technical-seo-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create report directory
        run: mkdir -p artifacts/technical-seo-watchdog

      - name: Check live technical SEO health
        id: check
        continue-on-error: true
        run: |
          python3 scripts/technical_seo_watchdog_runner.py \
            --base-url https://thousandoaksinjury.com \
            --output artifacts/technical-seo-watchdog/report.json

      - name: Inject safe remediation E2E fixture
        if: github.event_name == 'workflow_dispatch' && inputs.remediation_e2e_fixture == true
        run: |
          python3 - <<'PY'
          import json
          p='artifacts/technical-seo-watchdog/report.json'
          with open(p,encoding='utf-8') as f: r=json.load(f)
          r['healthy']=False
          r['findings']=[{'findingType':'robots','title':'[E2E fixture] robots sitemap declaration','summary':'Safe synthetic finding for approval-to-remediation validation; production is not unhealthy.','recommendedAction':'Ensure website/robots.txt declares Sitemap: https://thousandoaksinjury.com/sitemap.xml','e2eFixture':True}]
          r['fixture']=True
          with open(p,'w',encoding='utf-8') as f:
            json.dump(r,f,indent=2)
            f.write(chr(10))
          PY

      - name: Reconcile watchdog GitHub issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f artifacts/technical-seo-watchdog/report.json ]; then
            python3 scripts/reconcile_watchdog_issues.py \
              --report artifacts/technical-seo-watchdog/report.json
          else
            echo "Watchdog report was not produced; skipping issue reconciliation."
          fi

      - name: Upload watchdog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-seo-watchdog-report
          path: artifacts/technical-seo-watchdog/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow when production checks are unhealthy
        if: always() && steps.check.outcome == 'failure'
        run: |
          echo "Technical SEO Watchdog detected a critical production failure."
          exit 1

