name: Technical SEO Watchdog

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      remediation_e2e_fixture:
        description: 'Emit a safe synthetic robots finding for remediation E2E validation'
        required: false
        default: false
        type: boolean
      content_refresh_e2e_fixture:
        description: 'Emit a safe synthetic content_stale finding for Content Refresher E2E validation'
        required: false
        default: false
        type: boolean
      self_healing_e2e_fixture:
        description: 'Emit a safe synthetic GREEN e2e_fixture_marker finding to exercise the full autonomous closed loop (detect -> auto-approve -> execute -> verify -> audit) with no owner action'
        required: false
        default: false
        type: boolean
      self_healing_e2e_force_failure:
        description: 'With self_healing_e2e_fixture: deliberately fail post-merge verification to exercise the bounded retry/rollback/escalation path instead of success'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: technical-seo-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history is required for the content-staleness check: it
          # reads each real page file's actual git commit history
          # (git log -- <file>), which a shallow (depth-1) checkout cannot
          # answer correctly -- every file would appear to have been
          # touched by the single fetched commit regardless of its real age.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create report directory
        run: mkdir -p artifacts/technical-seo-watchdog

      - name: Check live technical SEO health
        id: check
        continue-on-error: true
        run: |
          python3 scripts/technical_seo_watchdog_runner.py \
            --base-url https://thousandoaksinjury.com \
            --output artifacts/technical-seo-watchdog/report.json

      - name: Inject safe remediation E2E fixture
        if: github.event_name == 'workflow_dispatch' && inputs.remediation_e2e_fixture == true
        run: |
          python3 - <<'PY'
          import json
          p='artifacts/technical-seo-watchdog/report.json'
          with open(p,encoding='utf-8') as f: r=json.load(f)
          r['healthy']=False
          r['findings']=[{'findingType':'robots','title':'[E2E fixture] robots sitemap declaration','summary':'Safe synthetic finding for approval-to-remediation validation; production is not unhealthy.','recommendedAction':'Ensure website/robots.txt declares Sitemap: https://thousandoaksinjury.com/sitemap.xml','e2eFixture':True}]
          r['fixture']=True
          with open(p,'w',encoding='utf-8') as f:
            json.dump(r,f,indent=2)
            f.write(chr(10))
          PY

      - name: Inject safe content-refresh E2E fixture
        if: github.event_name == 'workflow_dispatch' && inputs.content_refresh_e2e_fixture == true
        run: |
          python3 - <<'PY'
          import json, urllib.request
          p='artifacts/technical-seo-watchdog/report.json'
          with open(p,encoding='utf-8') as f: r=json.load(f)
          # Use the real live homepage's real current title/body so the
          # synthetic finding still carries genuinely real page content --
          # only the "this page is stale" claim itself is synthetic (marked
          # e2eFixture, clearly not an assertion that production is
          # actually stale), scoped to validating the Content Refresher
          # dispatch path end to end.
          req=urllib.request.Request("https://thousandoaksinjury.com/", headers={"User-Agent":"TechnicalSEO-Watchdog/1.0"})
          with urllib.request.urlopen(req, timeout=15) as resp:
              html=resp.read().decode("utf-8","replace")
          import re
          title_match=re.search(r"<title>(.*?)</title>", html, re.IGNORECASE | re.DOTALL)
          title=(title_match.group(1).strip() if title_match else "Thousand Oaks Injury Attorney")[:500]
          body=re.sub(r"<script.*?</script>|<style.*?</style>", " ", html, flags=re.IGNORECASE | re.DOTALL)
          body=re.sub(r"<[^>]+>", " ", body)
          body=" ".join(body.split())[:9000] or "Real existing homepage content."
          r['healthy']=False
          r.setdefault('findings', [])
          r['findings'].append({
              'findingType':'content_stale','check':'content_stale',
              'title':'[E2E fixture] content staleness check',
              'summary':'Safe synthetic staleness claim for Content Refresher E2E validation; production content freshness is not actually being asserted stale.',
              'recommendedAction':'Have Content Refresher propose an updated draft for owner review.',
              'url':'https://thousandoaksinjury.com/',
              'source_revision':'e2e-fixture','page_title':title,'page_body':body,
              'material_change_reason':'[E2E fixture] Safe synthetic reason for approval-to-Content-Refresher validation.',
              'e2eFixture':True,
          })
          r['fixture']=True
          with open(p,'w',encoding='utf-8') as f:
            json.dump(r,f,indent=2)
            f.write(chr(10))
          PY

      - name: Inject safe self-healing closed-loop E2E fixture
        if: github.event_name == 'workflow_dispatch' && inputs.self_healing_e2e_fixture == true
        env:
          FORCE_FAILURE: ${{ inputs.self_healing_e2e_force_failure }}
        run: |
          python3 - <<'PY'
          import json, os
          p='artifacts/technical-seo-watchdog/report.json'
          with open(p,encoding='utf-8') as f: r=json.load(f)
          # A real, unique-per-run marker value (not a fabricated constant)
          # so post-merge verification proves THIS run's fix landed, not a
          # stale leftover from an earlier run. e2e_fixture_marker is GREEN
          # (see control-center/lib/autonomy.js): a fully-green report is
          # picked up and executed automatically, with no owner approval,
          # by the same code path that handles a real GREEN finding --
          # this fixture exists to prove that whole loop, not to bypass it.
          marker_value = "e2e-" + os.environ.get("GITHUB_RUN_ID", "unknown")
          r['healthy']=False
          r.setdefault('findings', [])
          r['findings'].append({
              'findingType':'e2e_fixture_marker','check':'e2e_fixture_marker',
              'title':'[E2E fixture] self-healing closed-loop marker',
              'summary':'Safe synthetic GREEN finding for the self-healing closed-loop E2E fixture. Touches only a repository-internal marker file (remediation/e2e-fixture-marker.txt); it can never reach production content.',
              'recommendedAction':'Automatic remediation will write and verify this marker with no owner action.',
              'url':'',
              'fixture_marker_value': marker_value,
              'fixture_force_verification_failure': os.environ.get('FORCE_FAILURE','false'),
              'e2eFixture': True,
          })
          r['fixture']=True
          with open(p,'w',encoding='utf-8') as f:
            json.dump(r,f,indent=2)
            f.write(chr(10))
          PY

      - name: Reconcile watchdog GitHub issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f artifacts/technical-seo-watchdog/report.json ]; then
            python3 scripts/reconcile_watchdog_issues.py \
              --report artifacts/technical-seo-watchdog/report.json
          else
            echo "Watchdog report was not produced; skipping issue reconciliation."
          fi

      - name: Expose result to owner Review Queue
        if: always()
        run: |
          if [ -f artifacts/technical-seo-watchdog/report.json ]; then
            python3 - <<'PY'
          import base64, json, pathlib
          p=pathlib.Path("artifacts/technical-seo-watchdog/report.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          if "findings" not in r:
              # Keep every real field a failure carries (source_revision,
              # page_title, page_body, material_change_reason for a
              # content_stale finding) instead of a fixed subset -- the
              # camelCase aliases below are added on top for the fields the
              # approval/remediation route already expects by name.
              r["findings"]=[
                  {
                      **f,
                      "findingType": f.get("check","technical-seo"),
                      "title": f.get("title") or f.get("check","Technical SEO finding"),
                      "summary": f.get("evidence",""),
                      "recommendedAction": f.get("recommended_fix",""),
                      "url": f.get("url",""),
                      "fingerprint": f.get("fingerprint","")
                  }
                  for f in r.get("failures",[])
              ]
          payload=json.dumps(r,ensure_ascii=False,separators=(",",":")).encode()
          print("SLC_REVIEW_JSON_B64="+base64.b64encode(payload).decode())
          PY
          else
            echo "SLC_REVIEW_ERROR=watchdog report missing"
          fi

      - name: Notify Control Center of new result
        if: always()
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
        run: |
          if [ ! -f artifacts/technical-seo-watchdog/report.json ]; then
            echo "No report produced; skipping Control Center ingestion."
          elif [ -z "$CONTROL_CENTER_URL" ]; then
            echo "::warning::CONTROL_CENTER_URL not configured; the result will still reach Needs Approval next time the dashboard loads."
          else
            OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=slc-ai-control-ingest" | python3 -c "import json,sys; print(json.load(sys.stdin).get('value',''))")
            if [ -z "$OIDC_TOKEN" ]; then
              echo "::warning::Could not obtain a GitHub OIDC token; dashboard-load reconciliation remains as fallback."
            else
              curl -sS -f -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"agentId\":\"technical-seo-watchdog\",\"runId\":\"${GITHUB_RUN_ID}\"}" \
                || echo "::warning::Control Center ingest call failed; dashboard-load reconciliation remains as fallback."
            fi
          fi

      - name: Upload watchdog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-seo-watchdog-report
          path: artifacts/technical-seo-watchdog/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow only on a genuine watchdog runtime defect
        if: always()
        run: |
          # Detected SEO/content findings are the watchdog's normal, expected
          # output (surfaced via GitHub issues and the Control Center Review
          # Queue), not a reason to mark this run FAILURE. Only fail the run
          # when the watchdog itself did not produce a report at all, which
          # is a genuine operational defect distinct from a production
          # finding.
          if [ ! -f artifacts/technical-seo-watchdog/report.json ]; then
            echo "Technical SEO Watchdog did not produce a report; treating this as an agent runtime failure."
            exit 1
          fi

