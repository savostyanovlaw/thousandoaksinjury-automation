name: Opportunity Finder

on:
  schedule:
    - cron: '30 15 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: opportunity-finder
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest tests.test_opportunity_finder
      - name: Analyze live site
        run: python scripts/opportunity_finder.py --output artifacts/opportunity-finder/report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-finder-report
          path: artifacts/opportunity-finder/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Expose result to owner Review Queue
        if: always()
        run: |
          if [ -f artifacts/opportunity-finder/report.json ]; then
            python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/opportunity-finder/report.json').read_bytes()).decode())"
          fi

      - name: Notify Control Center of new result
        if: always()
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
        run: |
          if [ ! -f artifacts/opportunity-finder/report.json ]; then
            echo "No report produced; skipping Control Center ingestion."
          elif [ -z "$CONTROL_CENTER_URL" ]; then
            echo "::warning::CONTROL_CENTER_URL not configured; the result will still reach Needs Approval next time the dashboard loads."
          else
            OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=slc-ai-control-ingest" | python3 -c "import json,sys; print(json.load(sys.stdin).get('value',''))")
            if [ -z "$OIDC_TOKEN" ]; then
              echo "::warning::Could not obtain a GitHub OIDC token; dashboard-load reconciliation remains as fallback."
            else
              curl -sS -f -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"agentId\":\"opportunity-finder\",\"runId\":\"${GITHUB_RUN_ID}\"}" \
                || echo "::warning::Control Center ingest call failed; dashboard-load reconciliation remains as fallback."
            fi
          fi

  handoff:
    needs: analyze
    if: ${{ needs.analyze.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opportunity-finder-report
          path: artifacts/opportunity-finder
      - name: Trigger downstream draft from highest-priority real finding
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          sys.path.insert(0, os.getcwd())
          from scripts.opportunity_finder import topic_and_city_for_url
          report=json.load(open("artifacts/opportunity-finder/report.json"))
          findings=report.get("findings") or []
          if not findings:
              print("No actionable finding; downstream draft not dispatched.")
              raise SystemExit(0)
          finding=findings[0]
          url=finding["url"]
          issue=finding["type"]
          # The finding's "type" is a technical SEO defect (h1_count,
          # missing_title, ...), not a legal topic. Derive the real practice
          # area/city the page covers so Content Creator drafts reviewable
          # personal-injury content, and keep the technical trigger as
          # separate context (opportunity_type/source_url) for the reviewer.
          topic, city=topic_and_city_for_url(url)
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/content-creator.yml/dispatches",
              data=json.dumps({"ref":"main","inputs":{"topic":topic,"city":city,"source_url":url,"opportunity_type":issue}}).encode(),
              method="POST",
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json"})
          urllib.request.urlopen(req).read()
          print(json.dumps({"dispatched":"content-creator.yml","source_url":url,"opportunity_type":issue,"topic":topic,"city":city}))
          PY
