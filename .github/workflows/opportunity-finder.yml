name: Opportunity Finder

on:
  schedule:
    - cron: '30 15 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opportunity-finder
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest tests.test_opportunity_finder
      - name: Analyze live site
        run: python scripts/opportunity_finder.py --output artifacts/opportunity-finder/report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-finder-report
          path: artifacts/opportunity-finder/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Expose result to owner Review Queue
        if: always()
        run: |
          if [ -f artifacts/opportunity-finder/report.json ]; then
            python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/opportunity-finder/report.json').read_bytes()).decode())"
          fi
