name: Opportunity Finder

on:
  schedule:
    - cron: '30 15 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: opportunity-finder
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest tests.test_opportunity_finder
      - name: Analyze live site
        run: python scripts/opportunity_finder.py --output artifacts/opportunity-finder/report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-finder-report
          path: artifacts/opportunity-finder/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Expose result to owner Review Queue
        if: always()
        run: |
          if [ -f artifacts/opportunity-finder/report.json ]; then
            python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/opportunity-finder/report.json').read_bytes()).decode())"
          fi

  handoff:
    needs: analyze
    if: ${{ needs.analyze.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger safe downstream draft preparation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          # Safe GREEN handoff: downstream agents prepare review-only artifacts.
          # No merge, deploy, or publication is authorized here.
          for workflow in ("content-creator.yml",):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/{workflow}/dispatches",
                  data=json.dumps({"ref":"main","inputs":{"topic":"Live-site SEO opportunity review draft","city":"Thousand Oaks","source_url":"https://thousandoaksinjury.com/","opportunity_type":"opportunity-finder"}}).encode(),
                  method="POST",
                  headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json"})
              urllib.request.urlopen(req).read()
          PY
