name: Content Creator

on:
  # Event-driven: launched by Opportunity Finder or explicit operator request.
  workflow_dispatch:
    inputs:
      topic:
        description: Personal injury topic
        required: true
        type: string
      source_url:
        description: Live page that produced the opportunity
        required: false
        type: string
      opportunity_type:
        description: Opportunity Finder issue type
        required: false
        type: string
      city:
        description: Target city
        required: true
        default: Thousand Oaks
        type: string

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest tests.test_content_creator
      - name: Generate attorney-review draft
        env:
          TOPIC: ${{ inputs.topic || 'California personal injury attorney review draft' }}
          CITY: ${{ inputs.city || 'Thousand Oaks' }}
          SOURCE_URL: ${{ inputs.source_url || '' }}
          OPPORTUNITY_TYPE: ${{ inputs.opportunity_type || '' }}
        run: |
          python scripts/content_creator.py --topic "$TOPIC" --city "$CITY" --output artifacts/content-creator/draft.json
          python3 - <<'PY'
          import json, os
          p="artifacts/content-creator/draft.json"
          d=json.load(open(p))
          d["sourceUrl"]=os.environ.get("SOURCE_URL","")
          d["opportunityType"]=os.environ.get("OPPORTUNITY_TYPE","")
          open(p,"w").write(json.dumps(d,indent=2)+"\n")
          PY
      - name: Upload draft
        uses: actions/upload-artifact@v4
        with:
          name: content-creator-draft
          path: artifacts/content-creator/draft.json
          if-no-files-found: error
          retention-days: 30

      - name: Expose result to owner Review Queue
        if: always()
        run: |
          if [ -f artifacts/content-creator/draft.json ]; then
            python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/content-creator/draft.json').read_bytes()).decode())"
          fi

      - name: Notify Control Center of new result
        if: always()
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
        run: |
          if [ ! -f artifacts/content-creator/draft.json ]; then
            echo "No report produced; skipping Control Center ingestion."
          elif [ -z "$CONTROL_CENTER_URL" ]; then
            echo "::warning::CONTROL_CENTER_URL not configured; the result will still reach Needs Approval next time the dashboard loads."
          else
            OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=slc-ai-control-ingest" | python3 -c "import json,sys; print(json.load(sys.stdin).get('value',''))")
            if [ -z "$OIDC_TOKEN" ]; then
              echo "::warning::Could not obtain a GitHub OIDC token; dashboard-load reconciliation remains as fallback."
            else
              curl -sS -f -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"agentId\":\"content-creator\",\"runId\":\"${GITHUB_RUN_ID}\"}" \
                || echo "::warning::Control Center ingest call failed; dashboard-load reconciliation remains as fallback."
            fi
          fi

      - name: Trigger Russian-language review draft from this real draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f artifacts/content-creator/draft.json ]; then
            echo "No draft produced; skipping Russian-language handoff."
          else
            python3 - <<'PY'
          import json, os, urllib.request
          draft=json.load(open("artifacts/content-creator/draft.json"))
          title=draft.get("title") or ""
          body=(draft.get("draft") or "")[:9000]
          if not title or not body:
              print("Draft missing title/body; skipping Russian-language handoff.")
              raise SystemExit(0)
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/russian-language-robot.yml/dispatches",
              data=json.dumps({"ref":"main","inputs":{
                  "source_id":f"content-creator:{os.environ.get('GITHUB_RUN_ID','')}",
                  "source_revision":os.environ.get("GITHUB_SHA",""),
                  "title":title,
                  "body":body}}).encode(),
              method="POST",
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json"})
          urllib.request.urlopen(req).read()
          print(json.dumps({"dispatched":"russian-language-robot.yml","title":title}))
          PY
          fi

      - name: Trigger Video Engine package from this real draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f artifacts/content-creator/draft.json ]; then
            echo "No draft produced; skipping Video Engine handoff."
          else
            python3 - <<'PY'
          import json, os, urllib.request
          draft=json.load(open("artifacts/content-creator/draft.json"))
          topic=draft.get("topic") or ""
          city=draft.get("city") or ""
          if not topic or not city:
              print("Draft missing topic/city; skipping Video Engine handoff.")
              raise SystemExit(0)
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/video-engine.yml/dispatches",
              data=json.dumps({"ref":"main","inputs":{
                  "topic":topic,
                  "location":city,
                  "source_id":f"content-creator:{os.environ.get('GITHUB_RUN_ID','')}"}}).encode(),
              method="POST",
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json"})
          urllib.request.urlopen(req).read()
          print(json.dumps({"dispatched":"video-engine.yml","topic":topic,"location":city}))
          PY
          fi
