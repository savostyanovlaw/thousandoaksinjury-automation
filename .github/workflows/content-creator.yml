name: Content Creator

on:
  # Event-driven: launched by Opportunity Finder or explicit operator request.
  workflow_dispatch:
    inputs:
      topic:
        description: Personal injury topic
        required: true
        type: string
      source_url:
        description: Live page that produced the opportunity
        required: false
        type: string
      opportunity_type:
        description: Opportunity Finder issue type
        required: false
        type: string
      city:
        description: Target city
        required: true
        default: Thousand Oaks
        type: string

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest tests.test_content_creator
      - name: Generate attorney-review draft
        env:
          TOPIC: ${{ inputs.topic || 'California personal injury attorney review draft' }}
          CITY: ${{ inputs.city || 'Thousand Oaks' }}
          SOURCE_URL: ${{ inputs.source_url || '' }}
          OPPORTUNITY_TYPE: ${{ inputs.opportunity_type || '' }}
        run: |
          python scripts/content_creator.py --topic "$TOPIC" --city "$CITY" --output artifacts/content-creator/draft.json
          python3 - <<'PY'
          import json, os
          p="artifacts/content-creator/draft.json"
          d=json.load(open(p))
          d["sourceUrl"]=os.environ.get("SOURCE_URL","")
          d["opportunityType"]=os.environ.get("OPPORTUNITY_TYPE","")
          open(p,"w").write(json.dumps(d,indent=2)+"\n")
          PY
      - name: Upload draft
        uses: actions/upload-artifact@v4
        with:
          name: content-creator-draft
          path: artifacts/content-creator/draft.json
          if-no-files-found: error
          retention-days: 30

      - name: Expose result to owner Review Queue
        if: always()
        run: |
          if [ -f artifacts/content-creator/draft.json ]; then
            python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/content-creator/draft.json').read_bytes()).decode())"
          fi
