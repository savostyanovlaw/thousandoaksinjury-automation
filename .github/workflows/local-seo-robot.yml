name: Local SEO Robot

on:
  schedule:
    - cron: '15 16 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: local-seo-robot
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest tests.test_local_seo_robot
      - name: Audit local pages
        run: python scripts/local_seo_robot.py --output artifacts/local-seo-robot/report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: local-seo-robot-report
          path: artifacts/local-seo-robot/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Expose result to owner Review Queue
        if: always()
        run: |
          if [ -f artifacts/local-seo-robot/report.json ]; then
            python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/local-seo-robot/report.json').read_bytes()).decode())"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TEMP verify real OIDC token with actual production verifier (to be reverted)
        if: always()
        run: |
          npm install --prefix control-center --ignore-scripts
          node - <<'NODE'
          const { pathToFileURL } = require('node:url');
          (async () => {
            const { verifyGithubActionsToken } = await import(pathToFileURL(process.cwd()+'/control-center/lib/github-oidc.js'));
            async function requestToken(audience) {
              const url = `${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}`;
              const res = await fetch(url, { headers: { Authorization: `bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
              const body = await res.json();
              return body.value;
            }
            const token = await requestToken('slc-ai-control-ingest');
            console.log('=== Case 1: real token, correct audience -- should PASS ===');
            try {
              const payload = await verifyGithubActionsToken(token);
              console.log('VERIFIED OK. repository=' + payload.repository + ' run_id=' + payload.run_id + ' workflow=' + payload.workflow + ' ref=' + payload.ref + ' event_name=' + payload.event_name + ' exp=' + payload.exp);
            } catch (e) { console.log('UNEXPECTED FAILURE: ' + e.message); process.exitCode = 1; }

            console.log('=== Case 2: tampered signature -- should FAIL ===');
            const parts = token.split('.');
            const tamperedSig = parts[2].slice(0, -4) + (parts[2].slice(-4) === 'AAAA' ? 'BBBB' : 'AAAA');
            const tampered = `${parts[0]}.${parts[1]}.${tamperedSig}`;
            try {
              await verifyGithubActionsToken(tampered);
              console.log('UNEXPECTED: tampered token was accepted!');
              process.exitCode = 1;
            } catch (e) { console.log('CORRECTLY REJECTED: ' + e.message); }

            console.log('=== Case 3: real token, wrong audience -- should FAIL ===');
            const wrongAudienceToken = await requestToken('some-unrelated-audience');
            try {
              await verifyGithubActionsToken(wrongAudienceToken);
              console.log('UNEXPECTED: wrong-audience token was accepted!');
              process.exitCode = 1;
            } catch (e) { console.log('CORRECTLY REJECTED: ' + e.message); }
          })();
          NODE

      - name: Notify Control Center of new result
        if: always()
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
        run: |
          if [ ! -f artifacts/local-seo-robot/report.json ]; then
            echo "No report produced; skipping Control Center ingestion."
          elif [ -z "$CONTROL_CENTER_URL" ]; then
            echo "::warning::CONTROL_CENTER_URL not configured; the result will still reach Needs Approval next time the dashboard loads."
          else
            OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=slc-ai-control-ingest" | python3 -c "import json,sys; print(json.load(sys.stdin).get('value',''))")
            if [ -z "$OIDC_TOKEN" ]; then
              echo "::warning::Could not obtain a GitHub OIDC token; dashboard-load reconciliation remains as fallback."
            else
              curl -sS -f -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"agentId\":\"local-seo-robot\",\"runId\":\"${GITHUB_RUN_ID}\"}" \
                || echo "::warning::Control Center ingest call failed; dashboard-load reconciliation remains as fallback."
            fi
          fi
