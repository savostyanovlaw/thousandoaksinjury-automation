name: Local SEO Robot

on:
  schedule:
    - cron: '15 16 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-seo-robot
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest tests.test_local_seo_robot
      - name: Audit local pages
        run: python scripts/local_seo_robot.py --output artifacts/local-seo-robot/report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: local-seo-robot-report
          path: artifacts/local-seo-robot/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Expose result to owner Review Queue
        if: always()
        run: |
          if [ -f artifacts/local-seo-robot/report.json ]; then
            python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/local-seo-robot/report.json').read_bytes()).decode())"
          fi

      - name: TEMP diagnostic - verbose ingest probe (to be reverted)
        if: always()
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
          CONTROL_INGEST_TOKEN: ${{ secrets.CONTROL_INGEST_TOKEN }}
        run: |
          echo "CONTROL_CENTER_URL set: $([ -n "$CONTROL_CENTER_URL" ] && echo yes || echo no), length: ${#CONTROL_CENTER_URL}"
          echo "CONTROL_INGEST_TOKEN set: $([ -n "$CONTROL_INGEST_TOKEN" ] && echo yes || echo no), length: ${#CONTROL_INGEST_TOKEN}"
          echo "--- with configured secret ---"
          curl -sS -i -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
            -H "X-Control-Ingest-Token: $CONTROL_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"agentId":"technical-seo-watchdog","runId":"diag-1"}' || true
          echo ""
          echo "--- with deliberately wrong token ---"
          curl -sS -i -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
            -H "X-Control-Ingest-Token: definitely-wrong-token-for-diagnostics" \
            -H "Content-Type: application/json" \
            -d '{"agentId":"technical-seo-watchdog","runId":"diag-2"}' || true
          echo ""
          echo "--- with no token header ---"
          curl -sS -i -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
            -H "Content-Type: application/json" \
            -d '{"agentId":"technical-seo-watchdog","runId":"diag-3"}' || true
          echo ""
          echo "--- GET on control-center state (unauthenticated, expect 401 redirect-style JSON) ---"
          curl -sS -i "$CONTROL_CENTER_URL/api/control/state" || true

      - name: Notify Control Center of new result
        if: always()
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
          CONTROL_INGEST_TOKEN: ${{ secrets.CONTROL_INGEST_TOKEN }}
        run: |
          if [ ! -f artifacts/local-seo-robot/report.json ]; then
            echo "No report produced; skipping Control Center ingestion."
          elif [ -z "$CONTROL_CENTER_URL" ] || [ -z "$CONTROL_INGEST_TOKEN" ]; then
            echo "::warning::CONTROL_CENTER_URL/CONTROL_INGEST_TOKEN not configured; the result will still reach Needs Approval next time the dashboard loads."
          else
            curl -sS -f -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
              -H "X-Control-Ingest-Token: $CONTROL_INGEST_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"agentId\":\"local-seo-robot\",\"runId\":\"${GITHUB_RUN_ID}\"}" \
              || echo "::warning::Control Center ingest call failed; dashboard-load reconciliation remains as fallback."
          fi
