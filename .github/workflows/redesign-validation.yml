name: Premium Redesign Validation

on:
  push:
    branches:
      - claude/premium-redesign-v2
      - redesign/premium-v2
  pull_request:
    branches:
      - main
      - redesign/premium-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply deterministic money-funnel patch
        run: python3 scripts/apply_money_funnel_links.py
      - name: Commit generated city-page changes
        run: |
          if git diff --quiet -- website/agoura-hills/index.html website/camarillo/index.html website/newbury-park/index.html website/oak-park/index.html website/simi-valley/index.html website/westlake-village/index.html; then
            echo "No generated changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add website/agoura-hills/index.html website/camarillo/index.html website/newbury-park/index.html website/oak-park/index.html website/simi-valley/index.html website/westlake-village/index.html
            git commit -m "SEO: link city pages to primary PI funnels [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Upload Claude diagnostic repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: claude-debug-repository-snapshot
          path: |
            .
            !.git/**
          if-no-files-found: error
          retention-days: 7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run redesign unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run case-review endpoint tests
        run: node --test tests/case-review-endpoint.test.mjs
      - name: Run static site validator
        run: python3 scripts/validate_site.py --root website
      - name: Install Playwright package and browsers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory website >/tmp/premium-redesign-server.log 2>&1 &
          echo $! > /tmp/premium-redesign-server.pid
          sleep 2
      - name: Run cross-browser responsive smoke test
        run: node scripts/browser_smoke.js
      - name: Run cross-browser form payload smoke test
        run: node scripts/form_browser_smoke.js
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-redesign-browser-screenshots
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 14
