name: CTR Optimizer

on:
  schedule:
    - cron: '45 16 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest tests.test_ctr_optimizer
      - name: Analyze title and meta opportunities
        run: python scripts/ctr_optimizer.py --output artifacts/ctr-optimizer/report.json
      - name: Upload proposals
        uses: actions/upload-artifact@v4
        with:
          name: ctr-optimizer-report
          path: artifacts/ctr-optimizer/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Expose result to owner Review Queue
        if: always()
        run: |
          if [ -f artifacts/ctr-optimizer/report.json ]; then
            python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/ctr-optimizer/report.json').read_bytes()).decode())"
          fi
