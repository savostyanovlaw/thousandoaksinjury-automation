name: Internal Link Builder
on:
  schedule:
    - cron: '0 17 * * 3'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest tests.test_internal_link_builder
      - run: python scripts/internal_link_builder.py --output artifacts/internal-link-builder/report.json
      - uses: actions/upload-artifact@v4
        with: {name: internal-link-builder-report, path: artifacts/internal-link-builder/report.json, retention-days: 30}

      - name: Expose result to owner Review Queue
        if: always()
        run: |
          if [ -f artifacts/internal-link-builder/report.json ]; then
            python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/internal-link-builder/report.json').read_bytes()).decode())"
          fi

      - name: Notify Control Center of new result
        if: always()
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
          CONTROL_INGEST_TOKEN: ${{ secrets.CONTROL_INGEST_TOKEN }}
        run: |
          if [ ! -f artifacts/internal-link-builder/report.json ]; then
            echo "No report produced; skipping Control Center ingestion."
          elif [ -z "$CONTROL_CENTER_URL" ] || [ -z "$CONTROL_INGEST_TOKEN" ]; then
            echo "::warning::CONTROL_CENTER_URL/CONTROL_INGEST_TOKEN not configured; the result will still reach Needs Approval next time the dashboard loads."
          else
            curl -sS -f -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
              -H "X-Control-Ingest-Token: $CONTROL_INGEST_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"agentId\":\"internal-link-builder\",\"runId\":\"${GITHUB_RUN_ID}\"}" \
              || echo "::warning::Control Center ingest call failed; dashboard-load reconciliation remains as fallback."
          fi
