name: Internal Link Builder
on:
  schedule:
    - cron: '0 17 * * 3'
  workflow_dispatch:
permissions: {contents: read, id-token: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest tests.test_internal_link_builder
      - run: python scripts/internal_link_builder.py --output artifacts/internal-link-builder/report.json
      - uses: actions/upload-artifact@v4
        with: {name: internal-link-builder-report, path: artifacts/internal-link-builder/report.json, retention-days: 30}

      - name: Expose result to owner Review Queue
        if: always()
        run: |
          if [ -f artifacts/internal-link-builder/report.json ]; then
            python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/internal-link-builder/report.json').read_bytes()).decode())"
          fi

      - name: Notify Control Center of new result
        if: always()
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
        run: |
          if [ ! -f artifacts/internal-link-builder/report.json ]; then
            echo "No report produced; skipping Control Center ingestion."
          elif [ -z "$CONTROL_CENTER_URL" ]; then
            echo "::warning::CONTROL_CENTER_URL not configured; the result will still reach Needs Approval next time the dashboard loads."
          else
            OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=slc-ai-control-ingest" | python3 -c "import json,sys; print(json.load(sys.stdin).get('value',''))")
            if [ -z "$OIDC_TOKEN" ]; then
              echo "::warning::Could not obtain a GitHub OIDC token; dashboard-load reconciliation remains as fallback."
            else
              # Include this run's own already-computed suggestion count
              # directly (report.json is right here on disk) so the ingest
              # endpoint can recognize a genuinely zero-suggestion run and
              # auto-archive it without any owner action -- a bare
              # {agentId,runId} body can never do this (isNoActionReview has
              # nothing to evaluate), which is why every real zero-suggestion
              # run was landing in Needs Approval instead of Audit/History.
              PAYLOAD=$(python3 - <<'PY'
          import json, os
          report = json.load(open("artifacts/internal-link-builder/report.json"))
          count = int(report.get("suggestionCount") or 0)
          print(json.dumps({
              "agentId": "internal-link-builder",
              "runId": os.environ["GITHUB_RUN_ID"],
              "healthy": count == 0,
              "findingCount": count,
          }))
          PY
          )
              curl -sS -f -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                || echo "::warning::Control Center ingest call failed; dashboard-load reconciliation remains as fallback."
            fi
          fi
