name: Control Center Ingest Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ingest endpoint with full response body
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
          CONTROL_INGEST_TOKEN: ${{ secrets.CONTROL_INGEST_TOKEN }}
        run: |
          echo "CONTROL_CENTER_URL is set: $([ -n "$CONTROL_CENTER_URL" ] && echo yes || echo no)"
          echo "CONTROL_CENTER_URL value length: ${#CONTROL_CENTER_URL}"
          echo "CONTROL_INGEST_TOKEN is set: $([ -n "$CONTROL_INGEST_TOKEN" ] && echo yes || echo no)"
          echo "CONTROL_INGEST_TOKEN length: ${#CONTROL_INGEST_TOKEN}"
          echo "--- request with configured secret ---"
          curl -sS -i -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
            -H "X-Control-Ingest-Token: $CONTROL_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"agentId":"technical-seo-watchdog","runId":"diag-1"}' || true
          echo ""
          echo "--- request with deliberately wrong token (control) ---"
          curl -sS -i -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
            -H "X-Control-Ingest-Token: definitely-wrong-token-for-diagnostics" \
            -H "Content-Type: application/json" \
            -d '{"agentId":"technical-seo-watchdog","runId":"diag-2"}' || true
          echo ""
          echo "--- request with no token header at all (control) ---"
          curl -sS -i -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
            -H "Content-Type: application/json" \
            -d '{"agentId":"technical-seo-watchdog","runId":"diag-3"}' || true
