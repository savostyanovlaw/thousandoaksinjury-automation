name: Content Refresher
on:
  # Event-driven: dispatched against a real existing page (source_id/revision)
  # with a real, specific reason to refresh it. Never invoked with fabricated
  # "production-cycle" placeholder material, so autonomous scheduling stays
  # paused until a real caller supplies a real page.
  workflow_dispatch:
    inputs:
      source_id:
        description: Identifier of the real existing page being refreshed
        required: true
        type: string
      source_revision:
        description: Revision of the real existing page (commit SHA or run id)
        required: true
        type: string
      title:
        description: Real existing page title
        required: true
        type: string
      body:
        description: Real existing page body content
        required: true
        type: string
      material_change_reason:
        description: Specific, real reason this page needs a refresh
        required: false
        type: string
      proposed_changes_json:
        description: JSON array of concrete before/after changes with reason and sources; empty means no actionable proposal
        required: false
        default: '[]'
        type: string
      sources_json:
        description: JSON array of source URLs/citations supporting the proposed changes
        required: false
        default: '[]'
        type: string
  pull_request:
    paths: ['scripts/content_refresher.py','tests/test_content_refresher.py','.github/workflows/content-refresher.yml']
permissions: {contents: read, id-token: write}
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest tests.test_content_refresher -v
      - name: Generate attorney-review refresh package
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_ID: ${{ inputs.source_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          MATERIAL_CHANGE_REASON: ${{ inputs.material_change_reason }}
          PROPOSED_CHANGES_JSON: ${{ inputs.proposed_changes_json }}
          SOURCES_JSON: ${{ inputs.sources_json }}
        run: |
          mkdir -p artifacts/content-refresher
          python3 - <<'PY'
          import json, os
          from scripts.content_refresher import refresh
          reason=os.environ.get("MATERIAL_CHANGE_REASON","").strip()
          reasons=[reason] if reason else []
          proposed=json.loads(os.environ.get("PROPOSED_CHANGES_JSON") or "[]")
          sources=json.loads(os.environ.get("SOURCES_JSON") or "[]")
          result=refresh(os.environ["SOURCE_ID"],os.environ["SOURCE_REVISION"],os.environ["TITLE"],os.environ["BODY"],reasons,proposed,sources)
          open("artifacts/content-refresher/draft.json","w").write(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with: {name: content-refresher-review-draft, path: artifacts/content-refresher/draft.json, retention-days: 30}
      - name: Expose result to owner Review Queue
        if: github.event_name == 'workflow_dispatch'
        run: python -c "import base64,pathlib; print('SLC_REVIEW_JSON_B64='+base64.b64encode(pathlib.Path('artifacts/content-refresher/draft.json').read_bytes()).decode())"

      - name: Notify Control Center of new result
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
        run: |
          if [ ! -f artifacts/content-refresher/draft.json ]; then
            echo "No report produced; skipping Control Center ingestion."
          elif python3 -c "import json,sys; d=json.load(open('artifacts/content-refresher/draft.json')); sys.exit(0 if d.get('approvalState')=='NOT_REQUIRED' else 1)"; then
            echo "No actionable findings; auto-archived in workflow history and not added to Needs Approval."
          elif [ -z "$CONTROL_CENTER_URL" ]; then
            echo "::warning::CONTROL_CENTER_URL not configured; the result will still reach Needs Approval next time the dashboard loads."
          else
            OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=slc-ai-control-ingest" | python3 -c "import json,sys; print(json.load(sys.stdin).get('value',''))")
            if [ -z "$OIDC_TOKEN" ]; then
              echo "::warning::Could not obtain a GitHub OIDC token; dashboard-load reconciliation remains as fallback."
            else
              curl -sS -f -X POST "$CONTROL_CENTER_URL/api/control/ingest/review-result" \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"agentId\":\"content-refresher\",\"runId\":\"${GITHUB_RUN_ID}\"}" \
                || echo "::warning::Control Center ingest call failed; dashboard-load reconciliation remains as fallback."
            fi
          fi
