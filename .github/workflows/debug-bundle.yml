name: Debug Bundle
on: [push]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build_claude_debug_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: debug-bundle
          path: /tmp/thousandoaksinjury-claude-debug.zip
